name: Test production flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: invalid-token
          project-id: invalid-project-id
          org-id: invalid-org-id
          production: "true"
          github-token: ""
      - name: Assert action failed with production flag and invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials (production=true), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with production flag and invalid credentials"
