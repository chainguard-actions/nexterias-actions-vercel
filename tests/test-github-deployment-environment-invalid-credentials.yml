name: Test github-deployment-environment input fails gracefully with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-vercel-token-invalid
          project-id: fake-project-id
          org-id: fake-org-id
          github-token: ${{ github.token }}
          production: "false"
          github-deployment-environment: staging

      - name: Assert action failed as expected with invalid credentials and github-deployment-environment input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials and github-deployment-environment input, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when github-deployment-environment input is provided"
