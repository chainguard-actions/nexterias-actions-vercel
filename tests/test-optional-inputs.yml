name: Test optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: invalid-token
          project-id: invalid-project-id
          org-id: invalid-org-id
          production: 'false'
          cwd: '.'
          domain-alias: 'example.vercel.app'
          github-deployment-environment: 'preview'
          build-env: 'NODE_ENV=production'
          env: 'MY_VAR=hello'

      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when optional inputs are provided"
