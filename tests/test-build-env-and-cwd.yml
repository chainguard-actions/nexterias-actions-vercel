name: Test build-env, env, and cwd inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: invalid-token
          project-id: invalid-project-id
          org-id: invalid-org-id
          github-token: ""
          cwd: "."
          build-env: "NODE_ENV=production"
          env: "MY_VAR=hello"
      - name: Assert action failed with invalid credentials (build-env/env/cwd inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when build-env, env, and cwd inputs are set"
