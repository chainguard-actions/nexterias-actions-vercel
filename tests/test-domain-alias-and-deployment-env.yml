name: Test domain-alias and github-deployment-environment inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: invalid-token
          project-id: invalid-project-id
          org-id: invalid-org-id
          github-token: ""
          domain-alias: "example.com"
          github-deployment-environment: "staging"
      - name: Assert action failed with invalid credentials (domain-alias/github-deployment-environment inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid credentials when domain-alias and github-deployment-environment inputs are set"
