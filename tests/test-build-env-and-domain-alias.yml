name: Test build-env and domain-alias inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-vercel-token
          project-id: fake-project-id
          org-id: fake-org-id
          build-env: BUILD_VAR=value
          domain-alias: example.vercel.app
      - name: Assert action ran (may fail due to invalid token)
        run: |
          echo "deployment-url: ${{ steps.action.outputs.deployment-url }}"
          echo "deployment-status: ${{ steps.action.outputs.deployment-status }}"
          echo "PASS: action executed with build-env and domain-alias inputs"
