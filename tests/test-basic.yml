name: Test basic invocation with fake credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify dist/index.js exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/dist/index.js" ]; then
            echo "FAIL: dist/index.js not found"
            exit 1
          fi
          echo "PASS: dist/index.js exists"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-vercel-token
          project-id: fake-project-id
          org-id: fake-org-id
          github-token: fake-github-token

      - name: Assert action ran (outcome is not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"

      - name: Assert deployment-url output exists (even if empty on failure)
        env:
          DEPLOYMENT_URL: ${{ steps.action.outputs.deployment-url }}
          DEPLOYMENT_STATUS: ${{ steps.action.outputs.deployment-status }}
        run: |
          echo "deployment-url: '$DEPLOYMENT_URL'"
          echo "deployment-status: '$DEPLOYMENT_STATUS'"
          echo "PASS: outputs checked"
