name: Test extra inputs (build-env, cwd, domain-alias, env, github-deployment-environment)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-vercel-token
          project-id: fake-project-id
          org-id: fake-org-id
          build-env: NODE_ENV=test
          cwd: .
          domain-alias: example.vercel.app
          env: MY_VAR=hello
          github-deployment-environment: staging

      - name: Assert action ran (failed gracefully with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DEPLOY_URL: ${{ steps.action.outputs.deployment-url }}
          DEPLOY_STATUS: ${{ steps.action.outputs.deployment-status }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-url: $DEPLOY_URL"
          echo "deployment-status: $DEPLOY_STATUS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DEPLOY_URL" ]; then
              echo "FAIL: action succeeded but deployment-url is empty"
              exit 1
            fi
            echo "PASS: action succeeded with deployment-url='$DEPLOY_URL'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
