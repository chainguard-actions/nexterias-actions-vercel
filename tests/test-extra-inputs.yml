name: Test extra inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: dummy-vercel-token
          project-id: dummy-project-id
          org-id: dummy-org-id
          github-token: dummy-github-token
          production: 'false'
          prebuilt: 'false'
          cwd: '.'
          domain-alias: 'example.vercel.app'
          github-deployment-environment: 'staging'
          public: 'false'
          build-env: 'NODE_ENV=production'
          env: 'MY_VAR=hello'
      - name: Assert action ran (outputs may be empty with dummy credentials)
        env:
          DEPLOYMENT_URL: ${{ steps.action.outputs.deployment-url }}
          DEPLOYMENT_STATUS: ${{ steps.action.outputs.deployment-status }}
        run: |
          echo "deployment-url: $DEPLOYMENT_URL"
          echo "deployment-status: $DEPLOYMENT_STATUS"
          echo "PASS: action executed with all extra inputs"
