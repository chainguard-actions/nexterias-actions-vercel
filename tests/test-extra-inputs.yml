name: Test extra inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-vercel-token
          project-id: fake-project-id
          org-id: fake-org-id
          production: 'false'
          prebuilt: 'false'
          cwd: '.'
          domain-alias: 'example.vercel.app'
          github-deployment-environment: 'preview'
          public: 'false'
          build-env: 'NODE_ENV=production'
          env: 'MY_VAR=hello'

      - name: Assert action ran (outputs present or action errored with invalid creds)
        env:
          DEPLOY_URL: ${{ steps.action.outputs.deployment-url }}
          DEPLOY_STATUS: ${{ steps.action.outputs.deployment-status }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "deployment-url: $DEPLOY_URL"
          echo "deployment-status: $DEPLOY_STATUS"
          # The action is expected to fail with fake credentials.
          # We just verify it ran (outcome is either success or failure, not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with all extra inputs provided"
